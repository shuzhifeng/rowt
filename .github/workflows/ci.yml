name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax check
        run: |
          for f in bin/rowt install.sh .githooks/pre-commit .githooks/commit-msg .githooks/check-commit-messages.sh; do
            echo "bash -n $f"; bash -n "$f"
          done
      - name: shellcheck (errors only, advisory)
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --shell=bash --severity=error bin/rowt install.sh .githooks/pre-commit

  # No agent attribution (Co-Authored-By: Claude, Claude-Session, "Generated with
  # Claude Code") in what lands. .githooks/commit-msg refuses it in a local commit;
  # this catches what no local hook sees: a PR's commits and description, and a
  # squash merge whose body was written on GitHub (`gh pr merge --body`), which
  # turns main red the moment it lands. Commits already on main are not re-read.
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: no agent attribution
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          check=.githooks/check-commit-messages.sh
          if [ "$EVENT" = pull_request ]; then
            printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body"
            rc=0
            sh "$check" --message "$RUNNER_TEMP/pr-body" || rc=1
            sh "$check" "$PR_BASE..$PR_HEAD" || rc=1
            exit $rc
          fi
          # A new branch has an all-zero `before`, and a force-push's may no
          # longer exist: check the pushed tip alone then.
          if git rev-parse --quiet --verify "$BEFORE^{commit}" >/dev/null; then
            sh "$check" "$BEFORE..$SHA"
          else
            sh "$check" "$SHA~1..$SHA"
          fi

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PINNED. Unpinned, this installed whatever was newest and the gate moved
      # under the repo: ruff 0.16 widened its implicit default rule set, and
      # main went red on 31 findings in files nobody had touched. ruff.toml now
      # declares the selection so any version agrees, and the pin means the
      # FORMATTER cannot drift either — `ruff format --check` has no rule set to
      # declare, so its output is only reproducible if the version is fixed.
      - name: install ruff
        run: pipx install ruff==0.16.2
      - name: ruff check
        run: ruff check config/
      - name: ruff format --check
        run: ruff format --check config/
      - name: py_compile
        run: python -m py_compile config/*.py

  # The workspace: rowt-core (pure), rowt-platform (the OS seam) and rowt-cli
  # (`rowt-rs`). On macOS, because that is what the platform layer talks to —
  # `networksetup`, `scutil`, `launchctl`, `kern.boottime`. PORTING.md phase 5
  # calls for a real matrix (core on both, platform tests feature-gated); this
  # is the half of it that needs no Linux target, and it is the half that has
  # been missing entirely — `cargo test` has never run in CI.
  #
  # NOT `cargo fmt --check`: the tree is deliberately hand-formatted with long
  # lines and is not fmt-clean, per CLAUDE.md.
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: cargo build --release --workspace
      - name: cargo test
        run: cargo test --workspace
      # The monitor is its own workspace (its own Cargo.lock and goldens), so
      # it needs its own invocation or it is simply not built.
      - name: monitor tests
        working-directory: rowt-monitor
        run: cargo test

  # The differential gates are NOT here. `parity cli-diff` alone runs 241 cases
  # against a sandboxed bash, takes ~11 minutes, and five of its cases wait on a
  # router that is designed not to come up; `selftest` adds another ten. They
  # are the pre-release gate, run locally — see tests/parity/README.md. What CI
  # is for is catching the change that does not compile.
